<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FairShare — Expense Split & Email Notify</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
      padding: 24px 16px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { font-size: 13px; color: #64748b; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px;
    }
    .metric-label { font-size: 12px; color: #64748b; }
    .metric-value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .settlement-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    button {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-dark { background: #0f172a; color: #fff; }
    .btn-dark:hover { background: #1e293b; }
    .btn-ghost { background: #f1f5f9; color: #334155; }
    .btn-ghost:hover { background: #e2e8f0; }
    .btn-danger { background: transparent; color: #dc2626; padding: 4px 8px; font-size: 12px; }
    .btn-danger:hover { background: #fef2f2; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f1f5f9; }
    th { color: #64748b; font-weight: 600; font-size: 12px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .empty { color: #94a3b8; font-size: 13px; padding: 16px 0; text-align: center; }
    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .status.ok { display: block; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .status.err { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>FairShare</h1>
        <div class="subtitle">Expense Splitter &amp; EmailJS Notification (Person A &amp; Person B)</div>
      </div>
      <div class="subtitle mono" id="emailsHeader"></div>
    </header>

    <div class="summary-grid">
      <div class="card">
        <div class="metric-label">Total Shared</div>
        <div class="metric-value" id="totalAmount">৳0.00</div>
      </div>
      <div class="card">
        <div class="metric-label">Person A Paid</div>
        <div class="metric-value" id="aPaid">৳0.00</div>
      </div>
      <div class="card">
        <div class="metric-label">Person B Paid</div>
        <div class="metric-value" id="bPaid">৳0.00</div>
      </div>
    </div>

    <div class="settlement-box">
      <span id="settlementText">All settled — ৳0.00 balance</span>
      <div class="btn-row" style="margin-top:0">
        <button class="btn-dark" id="sendBothBtn" onclick="sendReport('BOTH')">Email Report to Both</button>
        <button class="btn-ghost" id="sendABtn" onclick="sendReport('A')">Email A</button>
        <button class="btn-ghost" id="sendBBtn" onclick="sendReport('B')">Email B</button>
      </div>
    </div>

    <div id="statusBox" class="status"></div>

    <div class="grid-2">
      <div class="card">
        <h2>Add Expense</h2>
        <form id="expenseForm">
          <div class="field">
            <label for="desc">Description</label>
            <input id="desc" type="text" placeholder="e.g. Groceries, Rent, Dinner" required />
          </div>
          <div class="field">
            <label for="amount">Amount (৳)</label>
            <input id="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required />
          </div>
          <div class="field">
            <label for="paidBy">Paid By</label>
            <select id="paidBy">
              <option value="A">Person A (hmarif315@gmail.com)</option>
              <option value="B">Person B (mdarifhasan171@gmail.com)</option>
            </select>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn-primary">Add Expense</button>
            <button type="button" class="btn-ghost" onclick="clearAll()">Clear All</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Expense History</h2>
        <div id="listContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      publicKey: "giv8wAa_rsK6SvvZ-",
      serviceId: "service_knnfve4",
      templateId: "template_ol1efuh",

      emails: {
        A: "hmarif315@gmail.com",
        B: "mdarifhasan171@gmail.com"
      }
    };

    emailjs.init({ publicKey: CONFIG.publicKey });

    const STORAGE_KEY = "fairshare_expenses_v1";
    let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    document.getElementById("emailsHeader").textContent =
      "A: " + CONFIG.emails.A + " · B: " + CONFIG.emails.B;

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    }

    function fmt(n) {
      return "৳" + Number(n || 0).toFixed(2);
    }

    function getSummary() {
      let total = 0, aPaid = 0, bPaid = 0;
      for (const e of expenses) {
        total += e.amount;
        if (e.paidBy === "A") aPaid += e.amount;
        else bPaid += e.amount;
      }
      const share = total / 2;
      const diff = aPaid - share; // >0 means B owes A; <0 means A owes B
      let settlement = "All settled — ৳0.00 balance";
      if (diff > 0.005) settlement = "Person B owes Person A " + fmt(diff);
      else if (diff < -0.005) settlement = "Person A owes Person B " + fmt(Math.abs(diff));
      return { total, aPaid, bPaid, share, diff, settlement };
    }

    function render() {
      const s = getSummary();
      document.getElementById("totalAmount").textContent = fmt(s.total);
      document.getElementById("aPaid").textContent = fmt(s.aPaid);
      document.getElementById("bPaid").textContent = fmt(s.bPaid);
      document.getElementById("settlementText").textContent = s.settlement;

      const container = document.getElementById("listContainer");
      if (expenses.length === 0) {
        container.innerHTML = '<div class="empty">No expenses added yet.</div>';
        return;
      }

      let rows = expenses.map((e) => `
        <tr>
          <td>
            <div style="font-weight:600">${escapeHtml(e.desc)}</div>
            <div style="font-size:11px;color:#64748b">Paid by ${e.paidBy} · ${e.date}</div>
          </td>
          <td class="num">${fmt(e.amount)}</td>
          <td style="text-align:right">
            <button class="btn-danger" onclick="removeExpense('${e.id}')">Remove</button>
          </td>
        </tr>
      `).join("");

      container.innerHTML = `
        <table>
          <thead><tr><th>Item</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function showStatus(msg, isError) {
      const box = document.getElementById("statusBox");
      box.textContent = msg;
      box.className = "status " + (isError ? "err" : "ok");
    }

    document.getElementById("expenseForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      const desc = document.getElementById("desc").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);
      const paidBy = document.getElementById("paidBy").value;
      if (!desc || isNaN(amount) || amount <= 0) return;

      expenses.unshift({
        id: String(Date.now()),
        desc,
        amount,
        paidBy,
        date: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" })
      });
      save();
      render();
      this.reset();
    });

    window.removeExpense = function (id) {
      expenses = expenses.filter((e) => e.id !== id);
      save();
      render();
    };

    window.clearAll = function () {
      expenses = [];
      save();
      render();
      showStatus("All expenses cleared.", false);
    };

    window.sendReport = async function (target) {
      const s = getSummary();
      const channels = target === "BOTH" ? ["A", "B"] : [target];
      const lines = expenses.length
        ? expenses.map((e) => `- ${e.desc}: ${fmt(e.amount)} (Paid by ${e.paidBy})`).join("\n")
        : "No expenses recorded yet.";

      const message =
        `FairShare Summary\n` +
        `Total: ${fmt(s.total)}\n` +
        `Person A Paid: ${fmt(s.aPaid)}\n` +
        `Person B Paid: ${fmt(s.bPaid)}\n` +
        `Settlement: ${s.settlement}\n\n` +
        `Items:\n${lines}`;

      const btns = ["sendBothBtn", "sendABtn", "sendBBtn"].map((id) => document.getElementById(id));
      btns.forEach((b) => (b.disabled = true));

      try {
        for (const ch of channels) {
          const toEmail = CONFIG.emails[ch];
          await emailjs.send(CONFIG.serviceId, CONFIG.templateId, {
            to_email: toEmail,
            email: toEmail,
            to_name: "Person " + ch,
            from_name: "FairShare",
            subject: "FairShare Balance Summary",
            title: "FairShare Balance Summary",
            message: message,
            time: new Date().toLocaleString()
          });
        }
        showStatus("Email sent successfully to " + channels.map((c) => CONFIG.emails[c]).join(" & "), false);
      } catch (err) {
        const detail = (err && (err.text || err.message)) || "Check your EmailJS template fields.";
        showStatus("EmailJS Error: " + detail, true);
      } finally {
        btns.forEach((b) => (b.disabled = false));
      }
    };

    render();
  </script>
</body>
</html>
