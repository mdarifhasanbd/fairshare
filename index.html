<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FairShare — Roommate Chore Tracker (Arif &amp; Ishak)</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      line-height: 1.55;
      padding: 24px 16px 48px;
    }
    .wrap { max-width: 780px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { font-size: 13px; color: #64748b; }
    .switcher {
      display: inline-flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 9px;
      gap: 4px;
    }
    .switcher button {
      border: none;
      background: transparent;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
    }
    .switcher button.active {
      background: #fff;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .stat { padding: 14px 16px; border-right: 1px solid #e2e8f0; }
    .stat:last-child { border-right: none; }
    .stat-label { font-size: 12px; color: #64748b; }
    .stat-val { font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .card-head h2 { font-size: 15px; font-weight: 600; }
    .chore-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid #f1f5f9;
      flex-wrap: wrap;
    }
    .chore-row.checked { background: #f8fafc; }
    .chore-row:last-child { border-bottom: none; }
    .chore-left { display: flex; align-items: flex-start; gap: 12px; min-width: 200px; flex: 1; }
    .chore-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chore-title {
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 5px;
      margin-left: -6px;
      display: inline-block;
    }
    .chore-bn { font-size: 13px; color: #64748b; font-weight: 500; margin-left: 4px; }
    .chore-meta { font-size: 12px; color: #64748b; margin-top: 3px; }
    .turn-highlight { color: #2563eb; font-weight: 600; }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-outline { background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; }
    .btn-outline:hover { background: #f1f5f9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .batch-bar {
      padding: 16px 18px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .batch-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .note-input {
      flex: 1;
      min-width: 200px;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
    }
    .preview-box { padding: 16px 18px; font-size: 13px; }
    .preview-subject { font-weight: 600; color: #0f172a; margin-bottom: 10px; }
    .preview-msg {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      color: #0f172a;
      font-size: 13px;
      line-height: 1.65;
    }
    .status {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .status.ok { display: block; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .status.err { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .log-item { padding: 12px 18px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    .log-item:last-child { border-bottom: none; }
    .log-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
    .empty { padding: 20px 18px; font-size: 13px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>FairShare</h1>
        <div class="sub" id="activeBanner"></div>
      </div>
      <div class="switcher" role="group" aria-label="Select who you are">
        <button id="btnUserA" onclick="setUser('A')">I am Arif</button>
        <button id="btnUserB" onclick="setUser('B')">I am Ishak</button>
      </div>
    </header>

    <div id="statusBox" class="status"></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Arif Done</div>
        <div class="stat-val" id="statA">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Ishak Done</div>
        <div class="stat-val" id="statB">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total Logged</div>
        <div class="stat-val" id="statTotal">0</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Daily Chores</h2>
        <span class="sub">Tick boxes to highlight &amp; preview polite English + বাংলা message</span>
      </div>
      <div id="choreList"></div>
      <div class="batch-bar">
        <div class="batch-row">
          <input id="noteInput" class="note-input" type="text" oninput="renderPreview()" placeholder="Optional note (e.g. Left extra water bottle on the table)" />
          <button id="batchBtn" class="btn btn-primary" onclick="submitChecked()" disabled>
            Send Checked Tasks (0)
          </button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Live Message Preview (English + বাংলা অর্থ)</h2>
        <span class="sub" id="previewCount">No tasks ticked</span>
      </div>
      <div class="preview-box" id="previewBox"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Recent Activity</h2>
        <button class="btn btn-outline" style="padding:5px 10px;font-size:12px" onclick="clearLogs()">Clear History</button>
      </div>
      <div id="logList"></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      publicKey: "giv8wAa_rsK6SvvZ-",
      serviceId: "service_knnfve4",
      templateId: "template_ol1efuh",

      emails: {
        A: "hmarif315@gmail.com",
        B: "mdarifhasan171@gmail.com"
      },
      names: {
        A: "Arif",
        B: "Ishak"
      }
    };

    emailjs.init({ publicKey: CONFIG.publicKey });

    const DEFAULT_CHORES = [
      { id: "trash", title: "Take Out the Trash", actionLower: "take out the trash", bnTitle: "ময়লা ফেলা", bnGenitive: "ময়লা ফেলার", colorHex: "#b45309", bgHex: "#fef3c7", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 },
      { id: "sweep", title: "Sweep the Room", actionLower: "sweep the room", bnTitle: "ঘর ঝাড়ু দেওয়া", bnGenitive: "ঘর ঝাড়ু দেওয়ার", colorHex: "#1d4ed8", bgHex: "#dbeafe", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 },
      { id: "basin", title: "Clean the Basin", actionLower: "clean the basin", bnTitle: "বেসিন পরিষ্কার", bnGenitive: "বেসিন পরিষ্কারের", colorHex: "#0f766e", bgHex: "#ccfbf1", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 },
      { id: "washroom", title: "Clean the Washroom", actionLower: "clean the washroom", bnTitle: "ওয়াশরুম পরিষ্কার", bnGenitive: "ওয়াশরুম পরিষ্কারের", colorHex: "#4338ca", bgHex: "#e0e7ff", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 },
      { id: "water", title: "Bring Water", actionLower: "bring water", bnTitle: "পানি আনা", bnGenitive: "পানি আনার", colorHex: "#0369a1", bgHex: "#e0f2fe", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 }
    ];

    let activeUser = localStorage.getItem("fs_user") === "B" ? "B" : "A";
    let savedChores = JSON.parse(localStorage.getItem("fs_chores") || "null");
    let chores = Array.isArray(savedChores) && savedChores.length
      ? DEFAULT_CHORES.map((base) => {
          const found = savedChores.find((x) => x.id === base.id) || {};
          return Object.assign({}, base, found, {
            actionLower: base.actionLower,
            bnTitle: base.bnTitle,
            bnGenitive: base.bnGenitive,
            colorHex: base.colorHex,
            bgHex: base.bgHex
          });
        })
      : DEFAULT_CHORES;
    let logs = JSON.parse(localStorage.getItem("fs_logs") || "[]");
    let checkedIds = new Set();
    let busy = false;

    function partnerOf(u) { return u === "A" ? "B" : "A"; }
    function escHtml(s) {
      return String(s).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }
    function hiSpan(text, colorHex, bgHex) {
      return '<span style="color:' + colorHex + ';background-color:' + bgHex + ';padding:2px 7px;border-radius:4px;font-weight:700;">' + escHtml(text) + '</span>';
    }
    function formatPoliteDateTime() {
      const d = new Date();
      const datePart = d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      const timePart = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
      return datePart + ", at " + timePart;
    }
    function saveState() {
      localStorage.setItem("fs_user", activeUser);
      localStorage.setItem("fs_chores", JSON.stringify(chores));
      localStorage.setItem("fs_logs", JSON.stringify(logs.slice(0, 100)));
    }

    function showStatus(text, isErr) {
      const el = document.getElementById("statusBox");
      el.textContent = text;
      el.className = "status " + (isErr ? "err" : "ok");
    }

    function buildMessage(selectedItems, note, nowStr) {
      const partner = partnerOf(activeUser);
      const actorName = CONFIG.names[activeUser];
      const partnerName = CONFIG.names[partner];
      const isSingle = selectedItems.length === 1;
      const joined = selectedItems.length <= 2
        ? selectedItems.map((i) => i.title).join(" & ")
        : selectedItems.slice(0, 2).map((i) => i.title).join(", ") + " +" + (selectedItems.length - 2) + " more";

      const subject = isSingle
        ? "FairShare: " + selectedItems[0].title + " Completed — Kindly Your Turn Next"
        : "FairShare: " + joined + " Completed — Kindly Your Turn Next";

      const enPlain = isSingle
        ? "Assalamu Alaikum " + partnerName + ",\n" +
          "I hope you’re doing well. Just wanted to let you know that I have completed [" + selectedItems[0].title + "] today (" + nowStr + ").\n" +
          (note ? "Note: " + note + "\n" : "") +
          "Since I’ve taken care of it this time, you’ll kindly be the next one to " + selectedItems[0].actionLower + ". I would appreciate your cooperation.\n" +
          "Thank you so much!\n— " + actorName
        : "Assalamu Alaikum " + partnerName + ",\n" +
          "I hope you’re doing well. Just wanted to let you know that I have completed the following tasks today (" + nowStr + "):\n" +
          selectedItems.map((i) => "• " + i.title).join("\n") + "\n" +
          (note ? "Note: " + note + "\n" : "") +
          "Since I’ve taken care of them this time, you’ll kindly be the next one to handle these tasks. I would appreciate your cooperation.\n" +
          "Thank you so much!\n— " + actorName;

      const bnPlain = isSingle
        ? "আসসালামু আলাইকুম " + partnerName + ",\n" +
          "আশা করি আপনি ভালো আছেন। আপনাকে জানাতে চাই যে, আজ আমি [" + selectedItems[0].bnGenitive + "] কাজটি সম্পন্ন করেছি (" + nowStr + ")।\n" +
          (note ? "নোট: " + note + "\n" : "") +
          "যেহেতু এবার আমি কাজটি করেছি, তাই পরবর্তীবার [" + selectedItems[0].bnGenitive + "] দায়িত্বটি আপনার থাকবে। এ বিষয়ে আপনার সহযোগিতা কামনা করছি।\n" +
          "আপনাকে অনেক ধন্যবাদ।\n— " + actorName
        : "আসসালামু আলাইকুম " + partnerName + ",\n" +
          "আশা করি আপনি ভালো আছেন। আপনাকে জানাতে চাই যে, আজ আমি নিচের কাজগুলো সম্পন্ন করেছি (" + nowStr + "):\n" +
          selectedItems.map((i) => "• " + i.bnTitle + " (" + i.title + ")").join("\n") + "\n" +
          (note ? "নোট: " + note + "\n" : "") +
          "যেহেতু এবার আমি কাজগুলো করেছি, তাই পরবর্তীবার এই কাজগুলোর দায়িত্বটি আপনার থাকবে। এ বিষয়ে আপনার সহযোগিতা কামনা করছি।\n" +
          "আপনাকে অনেক ধন্যবাদ।\n— " + actorName;

      const message = enPlain + "\n\nবাংলা অর্থ:\n" + bnPlain;

      const enHtml = isSingle
        ? '<p style="margin:0 0 8px 0;">Assalamu Alaikum ' + escHtml(partnerName) + ',</p>' +
          '<p style="margin:0 0 8px 0;">I hope you’re doing well. Just wanted to let you know that I have completed ' + hiSpan(selectedItems[0].title, selectedItems[0].colorHex, selectedItems[0].bgHex) + ' today (' + escHtml(nowStr) + ').</p>' +
          (note ? '<p style="margin:0 0 8px 0;color:#475569;"><strong>Note:</strong> ' + escHtml(note) + '</p>' : '') +
          '<p style="margin:0 0 8px 0;">Since I’ve taken care of it this time, you’ll kindly be the next one to ' + hiSpan(selectedItems[0].actionLower, selectedItems[0].colorHex, selectedItems[0].bgHex) + '. I would appreciate your cooperation.</p>' +
          '<p style="margin:0;">Thank you so much!</p>'
        : '<p style="margin:0 0 8px 0;">Assalamu Alaikum ' + escHtml(partnerName) + ',</p>' +
          '<p style="margin:0 0 8px 0;">I hope you’re doing well. Just wanted to let you know that I have completed the following tasks today (' + escHtml(nowStr) + '):</p>' +
          '<ul style="margin:0 0 10px 18px;padding:0;">' +
            selectedItems.map((i) => '<li style="margin:5px 0;">' + hiSpan(i.title, i.colorHex, i.bgHex) + '</li>').join('') +
          '</ul>' +
          (note ? '<p style="margin:0 0 8px 0;color:#475569;"><strong>Note:</strong> ' + escHtml(note) + '</p>' : '') +
          '<p style="margin:0 0 8px 0;">Since I’ve taken care of them this time, you’ll kindly be the next one to handle these tasks. I would appreciate your cooperation.</p>' +
          '<p style="margin:0;">Thank you so much!</p>';

      const bnHtml = isSingle
        ? '<p style="margin:0 0 8px 0;">আসসালামু আলাইকুম ' + escHtml(partnerName) + ',</p>' +
          '<p style="margin:0 0 8px 0;">আশা করি আপনি ভালো আছেন। আপনাকে জানাতে চাই যে, আজ আমি ' + hiSpan(selectedItems[0].bnGenitive, selectedItems[0].colorHex, selectedItems[0].bgHex) + ' কাজটি সম্পন্ন করেছি (' + escHtml(nowStr) + ')।</p>' +
          (note ? '<p style="margin:0 0 8px 0;color:#475569;"><strong>নোট:</strong> ' + escHtml(note) + '</p>' : '') +
          '<p style="margin:0 0 8px 0;">যেহেতু এবার আমি কাজটি করেছি, তাই পরবর্তীবার ' + hiSpan(selectedItems[0].bnGenitive, selectedItems[0].colorHex, selectedItems[0].bgHex) + ' দায়িত্বটি আপনার থাকবে। এ বিষয়ে আপনার সহযোগিতা কামনা করছি।</p>' +
          '<p style="margin:0;">আপনাকে অনেক ধন্যবাদ।</p>'
        : '<p style="margin:0 0 8px 0;">আসসালামু আলাইকুম ' + escHtml(partnerName) + ',</p>' +
          '<p style="margin:0 0 8px 0;">আশা করি আপনি ভালো আছেন। আপনাকে জানাতে চাই যে, আজ আমি নিচের কাজগুলো সম্পন্ন করেছি (' + escHtml(nowStr) + '):</p>' +
          '<ul style="margin:0 0 10px 18px;padding:0;">' +
            selectedItems.map((i) => '<li style="margin:5px 0;">' + hiSpan(i.bnTitle, i.colorHex, i.bgHex) + ' <span style="color:#64748b;">(' + escHtml(i.title) + ')</span></li>').join('') +
          '</ul>' +
          (note ? '<p style="margin:0 0 8px 0;color:#475569;"><strong>নোট:</strong> ' + escHtml(note) + '</p>' : '') +
          '<p style="margin:0 0 8px 0;">যেহেতু এবার আমি কাজগুলো করেছি, তাই পরবর্তীবার এই কাজগুলোর দায়িত্বটি আপনার থাকবে। এ বিষয়ে আপনার সহযোগিতা কামনা করছি।</p>' +
          '<p style="margin:0;">আপনাকে অনেক ধন্যবাদ।</p>';

      const messageHtml =
        '<div style="font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;font-size:14px;line-height:1.65;color:#0f172a;">' +
          enHtml +
          '<hr style="border:none;border-top:1px solid #e2e8f0;margin:14px 0;" />' +
          '<div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;">বাংলা অর্থ:</div>' +
          bnHtml +
          '<p style="margin:12px 0 0 0;color:#64748b;font-size:12px;">— ' + escHtml(actorName) + ' (FairShare)</p>' +
        '</div>';

      return { subject, message, messageHtml };
    }

    window.setUser = function (u) {
      activeUser = u;
      saveState();
      render();
    };

    window.toggleCheck = function (id) {
      if (checkedIds.has(id)) checkedIds.delete(id);
      else checkedIds.add(id);
      render();
    };

    window.renderPreview = function () {
      const selected = chores.filter((c) => checkedIds.has(c.id));
      const partner = partnerOf(activeUser);
      const countEl = document.getElementById("previewCount");
      const boxEl = document.getElementById("previewBox");
      if (selected.length === 0) {
        countEl.textContent = "No tasks ticked";
        boxEl.innerHTML = '<div class="sub">Jei box-e tick diben, sei kajer nam color-highlight kore polite English + বাংলা অর্থ ekhane dekha jabe (' + escHtml(CONFIG.names[partner]) + ' — ' + escHtml(CONFIG.emails[partner]) + ').</div>';
        return;
      }
      countEl.textContent = selected.length + " task" + (selected.length > 1 ? "s" : "") + " selected";
      const note = document.getElementById("noteInput").value.trim();
      const built = buildMessage(selected, note, formatPoliteDateTime());
      boxEl.innerHTML =
        '<div class="preview-subject">Subject: ' + escHtml(built.subject) + '</div>' +
        '<div class="preview-msg">' + built.messageHtml + '</div>';
    };

    async function dispatchTasks(taskIds) {
      if (busy || taskIds.length === 0) return;
      busy = true;
      render();

      const partner = partnerOf(activeUser);
      const actorName = CONFIG.names[activeUser];
      const partnerName = CONFIG.names[partner];
      const toEmail = CONFIG.emails[partner];
      const replyTo = CONFIG.emails[activeUser];
      const selectedChores = chores.filter((c) => taskIds.includes(c.id));
      const titles = selectedChores.map((c) => c.title);
      const bnTitles = selectedChores.map((c) => c.bnTitle);
      const note = document.getElementById("noteInput").value.trim();
      const nowStr = formatPoliteDateTime();
      const built = buildMessage(selectedChores, note, nowStr);
      const taskList = titles.join(", ");

      try {
        await emailjs.send(CONFIG.serviceId, CONFIG.templateId, {
          to_email: toEmail,
          email: toEmail,
          to_name: partnerName,
          from_name: actorName,
          name: actorName,
          reply_to: replyTo,
          from_email: replyTo,
          subject: built.subject,
          title: built.subject,
          message: built.message,
          message_html: built.messageHtml,
          msg: built.message,
          body: built.message,
          text: built.message,
          task: taskList,
          tasks: taskList,
          task_bn: bnTitles.join(", "),
          task_name: taskList,
          chore: taskList,
          chores: taskList,
          completed_tasks: taskList,
          completed_by: actorName,
          done_by: actorName,
          next_turn: partnerName,
          next_person: partnerName,
          time: nowStr
        });

        chores = chores.map((c) => {
          if (!taskIds.includes(c.id)) return c;
          return Object.assign({}, c, {
            nextTurn: partner,
            lastDoneBy: activeUser,
            lastDoneAt: new Date().toISOString(),
            countA: c.countA + (activeUser === "A" ? 1 : 0),
            countB: c.countB + (activeUser === "B" ? 1 : 0)
          });
        });

        logs.unshift({
          time: nowStr,
          by: actorName,
          notified: toEmail,
          tasks: titles,
          note: note,
          ok: true
        });

        checkedIds.clear();
        document.getElementById("noteInput").value = "";
        saveState();
        showStatus("Email sent to " + partnerName + " (" + toEmail + "): " + taskList + " completed!", false);
      } catch (err) {
        const msg = (err && (err.text || err.message)) || "EmailJS failed to send.";
        logs.unshift({
          time: nowStr,
          by: actorName,
          notified: toEmail,
          tasks: titles,
          note: note,
          ok: false,
          err: msg
        });
        saveState();
        showStatus("EmailJS Error: " + msg, true);
      } finally {
        busy = false;
        render();
      }
    }

    window.markSingleDone = function (id) { dispatchTasks([id]); };
    window.submitChecked = function () { dispatchTasks(Array.from(checkedIds)); };
    window.clearLogs = function () { logs = []; saveState(); render(); };

    function render() {
      const partner = partnerOf(activeUser);
      document.getElementById("btnUserA").className = activeUser === "A" ? "active" : "";
      document.getElementById("btnUserB").className = activeUser === "B" ? "active" : "";
      document.getElementById("activeBanner").textContent =
        "Notifying " + CONFIG.names[partner] + " (" + CONFIG.emails[partner] + ")";

      const sumA = chores.reduce((acc, c) => acc + c.countA, 0);
      const sumB = chores.reduce((acc, c) => acc + c.countB, 0);
      document.getElementById("statA").textContent = sumA;
      document.getElementById("statB").textContent = sumB;
      document.getElementById("statTotal").textContent = sumA + sumB;

      document.getElementById("choreList").innerHTML = chores.map((c) => {
        const isChecked = checkedIds.has(c.id);
        const lastInfo = c.lastDoneBy
          ? "Last done by " + CONFIG.names[c.lastDoneBy] + " · " + new Date(c.lastDoneAt).toLocaleDateString()
          : "Not logged yet";
        const turnName = CONFIG.names[c.nextTurn];
        const isYourTurn = c.nextTurn === activeUser;
        const titleStyle = isChecked
          ? "color:" + c.colorHex + ";background:" + c.bgHex + ";"
          : "color:" + c.colorHex + ";";
        return (
          '<div class="chore-row' + (isChecked ? ' checked' : '') + '">' +
            '<div class="chore-left">' +
              '<input type="checkbox" style="accent-color:' + c.colorHex + '" id="chk_' + c.id + '" ' + (isChecked ? 'checked' : '') + ' onchange="toggleCheck(\'' + c.id + '\')" />' +
              '<div>' +
                '<label class="chore-title" style="' + titleStyle + '" for="chk_' + c.id + '">' + escHtml(c.title) + '</label>' +
                '<span class="chore-bn">· ' + escHtml(c.bnTitle) + '</span>' +
                '<div class="chore-meta">' +
                  '<span class="' + (isYourTurn ? 'turn-highlight' : '') + '">Next turn: ' + escHtml(turnName) + '</span>' +
                  ' · ' + escHtml(lastInfo) +
                  ' · ' + escHtml(CONFIG.names.A) + ': ' + c.countA + ' / ' + escHtml(CONFIG.names.B) + ': ' + c.countB +
                '</div>' +
              '</div>' +
            '</div>' +
            '<button class="btn btn-outline" ' + (busy ? 'disabled' : '') + ' onclick="markSingleDone(\'' + c.id + '\')">' +
              (busy ? 'Sending...' : 'Done & Notify') +
            '</button>' +
          '</div>'
        );
      }).join("");

      const batchBtn = document.getElementById("batchBtn");
      batchBtn.disabled = busy || checkedIds.size === 0;
      batchBtn.textContent = busy
        ? "Sending..."
        : "Send Checked Tasks (" + checkedIds.size + ") & Notify " + CONFIG.names[partner];

      renderPreview();

      const logEl = document.getElementById("logList");
      if (logs.length === 0) {
        logEl.innerHTML = '<div class="empty">No chores logged yet. Tick a task or click "Done & Notify".</div>';
      } else {
        logEl.innerHTML = logs.slice(0, 15).map((l) => (
          '<div class="log-item">' +
            '<div><strong>' + escHtml(l.by) + '</strong> completed: ' + escHtml(l.tasks.join(", ")) + '</div>' +
            '<div class="log-meta">' +
              escHtml(l.time) + ' · Notified ' + escHtml(l.notified) + ' · ' +
              (l.ok ? '<span style="color:#15803d;font-weight:600">Sent</span>' : '<span style="color:#dc2626;font-weight:600">Failed: ' + escHtml(l.err || '') + '</span>') +
            '</div>' +
          '</div>'
        )).join("");
      }
    }

    render();
  </script>
</body>
</html>
