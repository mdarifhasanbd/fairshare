<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FairShare — Roommate Chore Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      line-height: 1.5;
      padding: 24px 16px 48px;
    }
    .wrap { max-width: 780px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { font-size: 13px; color: #64748b; }
    .switcher {
      display: inline-flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 9px;
      gap: 4px;
    }
    .switcher button {
      border: none;
      background: transparent;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
    }
    .switcher button.active {
      background: #fff;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .stat { padding: 14px 16px; border-right: 1px solid #e2e8f0; }
    .stat:last-child { border-right: none; }
    .stat-label { font-size: 12px; color: #64748b; }
    .stat-val { font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .card-head h2 { font-size: 15px; font-weight: 600; }
    .chore-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid #f1f5f9;
      flex-wrap: wrap;
    }
    .chore-row.checked { background: #eff6ff; }
    .chore-row:last-child { border-bottom: none; }
    .chore-left { display: flex; align-items: flex-start; gap: 12px; min-width: 200px; flex: 1; }
    .chore-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: #2563eb;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chore-title { font-size: 15px; font-weight: 600; color: #0f172a; cursor: pointer; }
    .chore-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
    .turn-highlight { color: #2563eb; font-weight: 600; }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-outline { background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; }
    .btn-outline:hover { background: #f1f5f9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .batch-bar {
      padding: 16px 18px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .batch-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .note-input {
      flex: 1;
      min-width: 200px;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
    }
    .preview-box {
      padding: 16px 18px;
      font-size: 13px;
    }
    .preview-subject { font-weight: 600; color: #0f172a; margin-bottom: 8px; }
    .preview-msg {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      white-space: pre-wrap;
      color: #334155;
      font-size: 13px;
      line-height: 1.55;
    }
    .status {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .status.ok { display: block; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .status.err { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .log-item {
      padding: 12px 18px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }
    .log-item:last-child { border-bottom: none; }
    .log-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
    .empty { padding: 20px 18px; font-size: 13px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>FairShare</h1>
        <div class="sub" id="activeBanner"></div>
      </div>
      <div class="switcher" role="group" aria-label="Select who you are">
        <button id="btnUserA" onclick="setUser('A')">Arif</button>
        <button id="btnUserB" onclick="setUser('B')">Ishak</button>
      </div>
    </header>

    <div id="statusBox" class="status"></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Arif Done</div>
        <div class="stat-val" id="statA">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Ishak Done</div>
        <div class="stat-val" id="statB">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total Logged</div>
        <div class="stat-val" id="statTotal">0</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Daily Chores</h2>
        <span class="sub">Tick boxes to build the message live, or click Done &amp; Notify</span>
      </div>
      <div id="choreList"></div>
      <div class="batch-bar">
        <div class="batch-row">
          <input id="noteInput" class="note-input" type="text" oninput="renderPreview()" placeholder="Optional note (e.g. Left extra water bottle on the table)" />
          <button id="batchBtn" class="btn btn-primary" onclick="submitChecked()" disabled>
            Send Checked Tasks (0)
          </button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Live Message Preview</h2>
        <span class="sub" id="previewCount">No tasks ticked</span>
      </div>
      <div class="preview-box" id="previewBox"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Recent Activity</h2>
        <button class="btn btn-outline" style="padding:5px 10px;font-size:12px" onclick="clearLogs()">Clear History</button>
      </div>
      <div id="logList"></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      publicKey: "giv8wAa_rsK6SvvZ-",
      serviceId: "service_knnfve4",
      templateId: "template_ol1efuh",

      emails: {
        Arif: "hmarif315@gmail.com",
        Ishak: "mdarifhasan171@gmail.com"
      },
      names: {
        Arif: "Arif",
        Ishak: "Ishak"
      }
    };

    emailjs.init({ publicKey: CONFIG.publicKey });

    const DEFAULT_CHORES = [
      { id: "trash", title: "Take Out the Trash", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 },
      { id: "sweep", title: "Sweep the Room", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 },
      { id: "basin", title: "Clean the Basin", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 },
      { id: "washroom", title: "Clean the Washroom", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 },
      { id: "water", title: "Bring Water", nextTurn: "A", lastDoneBy: null, lastDoneAt: null, countA: 0, countB: 0 }
    ];

    let activeUser = localStorage.getItem("fs_user") === "B" ? "B" : "A";
    let chores = JSON.parse(localStorage.getItem("fs_chores") || "null") || DEFAULT_CHORES;
    let logs = JSON.parse(localStorage.getItem("fs_logs") || "[]");
    let checkedIds = new Set();
    let busy = false;

    function partnerOf(u) { return u === "A" ? "B" : "A"; }
    function saveState() {
      localStorage.setItem("fs_user", activeUser);
      localStorage.setItem("fs_chores", JSON.stringify(chores));
      localStorage.setItem("fs_logs", JSON.stringify(logs.slice(0, 100)));
    }

    function showStatus(text, isErr) {
      const el = document.getElementById("statusBox");
      el.textContent = text;
      el.className = "status " + (isErr ? "err" : "ok");
    }

    function buildMessage(titles, note, nowStr) {
      const partner = partnerOf(activeUser);
      const actorName = CONFIG.names[activeUser];
      const partnerName = CONFIG.names[partner];
      const joined = titles.length <= 2 ? titles.join(" & ") : titles.slice(0, 2).join(", ") + " +" + (titles.length - 2) + " more";
      const subject = titles.length === 1
        ? "FairShare: " + titles[0] + " completed — Next it's your turn!"
        : "FairShare: " + joined + " completed — Next it's your turn!";

      const message = titles.length === 1
        ? "Hi " + partnerName + ",\n\n" +
          "I have completed \"" + titles[0] + "\" today (" + nowStr + ").\n" +
          (note ? "Note: " + note + "\n" : "") +
          "Next time, it's your turn for " + titles[0] + "!\n\n" +
          "— " + actorName + " (FairShare)"
        : "Hi " + partnerName + ",\n\n" +
          "I have completed the following tasks today (" + nowStr + "):\n" +
          titles.map((t) => "- " + t).join("\n") + "\n" +
          (note ? "\nNote: " + note + "\n" : "") +
          "\nNext time, it's your turn for these tasks!\n\n" +
          "— " + actorName + " (FairShare)";

      return { subject, message };
    }

    window.setUser = function (u) {
      activeUser = u;
      saveState();
      render();
    };

    window.toggleCheck = function (id) {
      if (checkedIds.has(id)) checkedIds.delete(id);
      else checkedIds.add(id);
      render();
    };

    window.renderPreview = function () {
      const selected = chores.filter((c) => checkedIds.has(c.id)).map((c) => c.title);
      const partner = partnerOf(activeUser);
      const countEl = document.getElementById("previewCount");
      const boxEl = document.getElementById("previewBox");
      if (selected.length === 0) {
        countEl.textContent = "No tasks ticked";
        boxEl.innerHTML = '<div class="sub">Tick any chore box above to see the completion message for ' + CONFIG.emails[partner] + '.</div>';
        return;
      }
      countEl.textContent = selected.length + " task" + (selected.length > 1 ? "s" : "") + " selected";
      const note = document.getElementById("noteInput").value.trim();
      const built = buildMessage(selected, note, new Date().toLocaleString());
      boxEl.innerHTML =
        '<div class="preview-subject">Subject: ' + built.subject.replace(/</g, "&lt;") + '</div>' +
        '<div class="preview-msg">' + built.message.replace(/</g, "&lt;") + '</div>';
    };

    async function dispatchTasks(taskIds) {
      if (busy || taskIds.length === 0) return;
      busy = true;
      render();

      const partner = partnerOf(activeUser);
      const actorName = CONFIG.names[activeUser];
      const partnerName = CONFIG.names[partner];
      const toEmail = CONFIG.emails[partner];
      const replyTo = CONFIG.emails[activeUser];
      const selectedChores = chores.filter((c) => taskIds.includes(c.id));
      const titles = selectedChores.map((c) => c.title);
      const note = document.getElementById("noteInput").value.trim();
      const nowStr = new Date().toLocaleString();
      const built = buildMessage(titles, note, nowStr);
      const taskList = titles.join(", ");

      try {
        await emailjs.send(CONFIG.serviceId, CONFIG.templateId, {
          to_email: toEmail,
          email: toEmail,
          to_name: partnerName,
          from_name: actorName,
          name: actorName,
          reply_to: replyTo,
          from_email: replyTo,
          subject: built.subject,
          title: built.subject,
          message: built.message,
          msg: built.message,
          body: built.message,
          text: built.message,
          task: taskList,
          tasks: taskList,
          task_name: taskList,
          chore: taskList,
          chores: taskList,
          completed_tasks: taskList,
          completed_by: actorName,
          done_by: actorName,
          next_turn: partnerName,
          next_person: partnerName,
          time: nowStr
        });

        chores = chores.map((c) => {
          if (!taskIds.includes(c.id)) return c;
          return {
            ...c,
            nextTurn: partner,
            lastDoneBy: activeUser,
            lastDoneAt: new Date().toISOString(),
            countA: c.countA + (activeUser === "A" ? 1 : 0),
            countB: c.countB + (activeUser === "B" ? 1 : 0)
          };
        });

        logs.unshift({
          time: nowStr,
          by: actorName,
          notified: toEmail,
          tasks: titles,
          note: note,
          ok: true
        });

        checkedIds.clear();
        document.getElementById("noteInput").value = "";
        saveState();
        showStatus("Email sent to " + partnerName + " (" + toEmail + "): " + taskList + " completed!", false);
      } catch (err) {
        const msg = (err && (err.text || err.message)) || "EmailJS failed to send.";
        logs.unshift({
          time: nowStr,
          by: actorName,
          notified: toEmail,
          tasks: titles,
          note: note,
          ok: false,
          err: msg
        });
        saveState();
        showStatus("EmailJS Error: " + msg, true);
      } finally {
        busy = false;
        render();
      }
    }

    window.markSingleDone = function (id) {
      dispatchTasks([id]);
    };

    window.submitChecked = function () {
      dispatchTasks(Array.from(checkedIds));
    };

    window.clearLogs = function () {
      logs = [];
      saveState();
      render();
    };

    function render() {
      const partner = partnerOf(activeUser);
      document.getElementById("btnUserA").className = activeUser === "A" ? "active" : "";
      document.getElementById("btnUserB").className = activeUser === "B" ? "active" : "";
      document.getElementById("activeBanner").textContent =
        "Notifying " + CONFIG.names[partner] + " (" + CONFIG.emails[partner] + ")";

      const sumA = chores.reduce((acc, c) => acc + c.countA, 0);
      const sumB = chores.reduce((acc, c) => acc + c.countB, 0);
      document.getElementById("statA").textContent = sumA;
      document.getElementById("statB").textContent = sumB;
      document.getElementById("statTotal").textContent = sumA + sumB;

      document.getElementById("choreList").innerHTML = chores.map((c) => {
        const isChecked = checkedIds.has(c.id);
        const lastInfo = c.lastDoneBy
          ? "Last done by " + CONFIG.names[c.lastDoneBy] + " · " + new Date(c.lastDoneAt).toLocaleDateString()
          : "Not logged yet";
        const turnName = CONFIG.names[c.nextTurn];
        const isYourTurn = c.nextTurn === activeUser;
        return (
          '<div class="chore-row' + (isChecked ? ' checked' : '') + '">' +
            '<div class="chore-left">' +
              '<input type="checkbox" id="chk_' + c.id + '" ' + (isChecked ? 'checked' : '') + ' onchange="toggleCheck(\'' + c.id + '\')" />' +
              '<div>' +
                '<label class="chore-title" for="chk_' + c.id + '">' + c.title + '</label>' +
                '<div class="chore-meta">' +
                  '<span class="' + (isYourTurn ? 'turn-highlight' : '') + '">Next turn: ' + turnName + '</span>' +
                  ' · ' + lastInfo +
                  ' · A: ' + c.countA + ' / B: ' + c.countB +
                '</div>' +
              '</div>' +
            '</div>' +
            '<button class="btn btn-outline" ' + (busy ? 'disabled' : '') + ' onclick="markSingleDone(\'' + c.id + '\')">' +
              (busy ? 'Sending...' : 'Done & Notify') +
            '</button>' +
          '</div>'
        );
      }).join("");

      const batchBtn = document.getElementById("batchBtn");
      batchBtn.disabled = busy || checkedIds.size === 0;
      batchBtn.textContent = busy
        ? "Sending..."
        : "Send Checked Tasks (" + checkedIds.size + ") & Notify " + CONFIG.names[partner];

      renderPreview();

      const logEl = document.getElementById("logList");
      if (logs.length === 0) {
        logEl.innerHTML = '<div class="empty">No chores logged yet. Tick a task or click "Done & Notify".</div>';
      } else {
        logEl.innerHTML = logs.slice(0, 15).map((l) => (
          '<div class="log-item">' +
            '<div><strong>' + l.by + '</strong> completed: ' + l.tasks.join(", ") + '</div>' +
            '<div class="log-meta">' +
              l.time + ' · Notified ' + l.notified + ' · ' +
              (l.ok ? '<span style="color:#15803d;font-weight:600">Sent</span>' : '<span style="color:#dc2626;font-weight:600">Failed: ' + (l.err || '') + '</span>') +
            '</div>' +
          '</div>'
        )).join("");
      }
    }

    render();
  </script>
</body>
</html>
